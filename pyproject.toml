[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hearsay-interview-copilot"
version = "0.1.0"
description = "Local-first interview assistance built on Hearsay transcript events."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
embeddings = [
  "fastembed>=0.7",
]
postgres = [
  "psycopg[binary]>=3.3.4,<4",
  "pgvector>=0.5,<1",
]
dev = [
  "pytest>=8.0",
  "ruff==0.16.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# `scripts/ci` is here because its `test_*.py` files would otherwise be
# collected by nothing: `pytest -q` (CI's own Lint, Test & Build step) walked
# only `tests`, so scripts/ci/test_check_gitleaks_signal_integrity.py would be
# green-by-omission. Adding the path makes every committed test reachable from
# the one canonical entrypoint. Same fix as worktrail's own pyproject.toml.
testpaths = ["tests", "scripts/ci"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
