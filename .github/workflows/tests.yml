name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install quality tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: ruff format --check src tests

  test:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  pgvector:
    name: Pgvector conformance
    runs-on: ubuntu-latest
    env:
      INTERVIEW_COPILOT_TEST_PG_URL: postgresql://copilot:copilot@localhost:5432/copilot_test
      INTERVIEW_COPILOT_TEST_PG_SSLMODE: disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Checkout pgvector v0.8.6
        uses: actions/checkout@v7.0.1
        with:
          repository: pgvector/pgvector
          ref: v0.8.6
          path: .ci/pgvector
          persist-credentials: false
      - name: Install PostgreSQL 18 build dependencies
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes \
              --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            postgresql-18 \
            postgresql-client-18 \
            postgresql-server-dev-18
      - name: Build and install pgvector v0.8.6
        working-directory: .ci/pgvector
        run: |
          make -j2
          sudo make install
      - name: Start PostgreSQL 18
        run: |
          if ! pg_lsclusters | awk '$1 == "18" && $2 == "main" { found = 1 } END { exit !found }'; then
            sudo pg_createcluster 18 main --port 5432
          fi

          sudo service postgresql stop || true
          sudo pg_conftool 18 main set port 5432
          sudo pg_ctlcluster 18 main start

          for attempt in $(seq 1 30); do
            if /usr/lib/postgresql/18/bin/pg_isready -h localhost -p 5432; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "PostgreSQL 18 did not become ready on port 5432" >&2
              pg_lsclusters >&2 || true
              sudo pg_ctlcluster 18 main status >&2 || true
              exit 1
            fi
            sleep 2
          done

          sudo -u postgres psql --port=5432 --set=ON_ERROR_STOP=1 \
            --command="CREATE ROLE copilot LOGIN PASSWORD 'copilot';"
          sudo -u postgres createdb --port=5432 --owner=copilot copilot_test
          sudo -u postgres psql --port=5432 --set=ON_ERROR_STOP=1 \
            --dbname=copilot_test \
            --command="CREATE EXTENSION vector;"
          sudo -u postgres psql --port=5432 --tuples-only --no-align \
            --dbname=copilot_test \
            --command="SELECT extversion FROM pg_extension WHERE extname = 'vector';"
      - name: Install PostgreSQL provider
        run: python -m pip install -e ".[dev,postgres]"
      - name: Run pgvector provider conformance
        run: pytest -q tests/test_pgvector_provider.py
      - name: Stop PostgreSQL 18
        if: always()
        run: sudo pg_ctlcluster 18 main stop --mode fast || true

  required:
    name: Required
    if: always()
    needs: [lint, test, pgvector]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PGVECTOR_RESULT: ${{ needs.pgvector.result }}
        run: |
          test "$LINT_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          test "$PGVECTOR_RESULT" = "success"
