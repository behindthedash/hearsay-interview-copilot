name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install quality tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: ruff format --check src tests

  test:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  pgvector:
    name: Pgvector conformance
    runs-on: ubuntu-latest
    env:
      INTERVIEW_COPILOT_TEST_PG_URL: postgresql://copilot:copilot@localhost:5432/copilot_test
      INTERVIEW_COPILOT_TEST_PG_SSLMODE: disable
      PGVECTOR_IMAGE: pgvector/pgvector:0.8.6-pg18
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Pull pgvector image with retries
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull "$PGVECTOR_IMAGE"; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Failed to pull $PGVECTOR_IMAGE after $attempt attempts" >&2
              exit 1
            fi
            delay=$((attempt * 10))
            echo "Docker pull attempt $attempt failed; retrying in ${delay}s..." >&2
            sleep "$delay"
          done
      - name: Start pgvector PostgreSQL
        run: |
          docker run --detach \
            --name interview-copilot-pgvector \
            --publish 5432:5432 \
            --env POSTGRES_USER=copilot \
            --env POSTGRES_PASSWORD=copilot \
            --env POSTGRES_DB=copilot_test \
            "$PGVECTOR_IMAGE"

          for attempt in $(seq 1 30); do
            if docker exec interview-copilot-pgvector \
              pg_isready -U copilot -d copilot_test; then
              exit 0
            fi
            sleep 2
          done

          echo "pgvector PostgreSQL did not become ready" >&2
          docker logs interview-copilot-pgvector >&2 || true
          exit 1
      - name: Install PostgreSQL provider
        run: python -m pip install -e ".[dev,postgres]"
      - name: Run pgvector provider conformance
        run: pytest -q tests/test_pgvector_provider.py
      - name: Stop pgvector PostgreSQL
        if: always()
        run: docker rm --force interview-copilot-pgvector || true

  required:
    name: Required
    if: always()
    needs: [lint, test, pgvector]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PGVECTOR_RESULT: ${{ needs.pgvector.result }}
        run: |
          test "$LINT_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          test "$PGVECTOR_RESULT" = "success"
